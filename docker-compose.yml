services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: emrtd
      POSTGRES_PASSWORD: emrtd
      POSTGRES_DB: emrtd_verify
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  face-match:
    build: ./services/face-match
    env_file: .env
    ports:
      - "8001:8001"

  api:
    build: ./apps/api
    env_file: .env
    depends_on:
      - postgres
      - redis
      - face-match
    ports:
      - "3000:3000"

  # Processus worker BullMQ, séparé de l'API HTTP pour un scaling horizontal indépendant
  # (voir docs/roadmap.md Phase 6 "processus séparé") : même image que `api`, commande différente
  # (apps/api/src/worker.ts). Peut être répliqué (`docker compose up --scale worker=N`) sans
  # affecter l'API HTTP.
  worker:
    build: ./apps/api
    command: ["node", "-r", "ts-node/register/transpile-only", "dist/worker.js"]
    env_file: .env
    environment:
      WORKER_METRICS_PORT: 3001
    depends_on:
      - postgres
      - redis
      - face-match
    ports:
      - "3001:3001"

volumes:
  postgres-data:
